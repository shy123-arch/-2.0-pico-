      "controller_to_tool": [0, 0, 0, 0, 0, 0, 1],
      "joints": []
    },
    "right": {
      "end_effector_frame": "sim_right_tool",
      "controller_to_tool": [0, 0, 0, 0, 0, 0, 1],
      "joints": []
    }
  },
  "base": {
    "enabled": false,
    "topic": "/cmd_vel",
    "max_linear_m_s": 0.20,
    "max_angular_rad_s": 0.30
  },
  "grippers": {
    "enabled": false,
    "left_topic": "/left_gripper/command",
    "right_topic": "/right_gripper/command"
  }
